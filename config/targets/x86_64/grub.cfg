# Direct boot without menu
set timeout=0
set default=0

# Hidden menuentry that boots directly.
#
# The kernel carries both boot headers (Multiboot 2 first, Multiboot 1 second),
# so this uses the Multiboot 2 protocol: a tagged boot information block instead
# of the fixed Multiboot 1 structure. Change "multiboot2" to "multiboot" to boot
# the Multiboot 1 header instead; the kernel supports both entry signatures.
menuentry "GamerOS" --unrestricted {
    multiboot2 /boot/kernel.elf
    boot
}
