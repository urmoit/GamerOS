# Direct boot without menu
set timeout=0
set default=0

# Hidden menuentry that boots directly.
#
# The kernel carries both boot headers (Multiboot 2 first, Multiboot 1 second),
# so this uses the Multiboot 1 protocol: GRUB loads the kernel from the fixed
# Multiboot 1 structure (VIDEO_MODE flag set, with the 1920x1080x32 graphics
# request fields). Change "multiboot" to "multiboot2" to boot the Multiboot 2
# header instead; GRUB rejects that header when it carries the framebuffer tag
# it cannot set in headless guests, which is why MB1 is the default here.
menuentry "GamerOS" --unrestricted {
    multiboot /boot/kernel.elf
    boot
}
